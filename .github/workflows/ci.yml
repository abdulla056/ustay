name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch/PR; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: check / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the bun version used locally (see README).
          bun-version: 1.3.10

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The `client` and `storybook` vitest projects run in a real browser via
      # @vitest/browser-playwright, so chromium has to be present.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Type-check
        run: bun run check

      - name: Lint (prettier + eslint)
        run: bun run lint

      # Unit/component lane only — no Postgres service; the schema-shape tests
      # run without a database by design (see docs/DATABASE.md). The DB
      # integration lane is tracked separately.
      - name: Test
        run: bun run test
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
