name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch/PR; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: check / lint / test
    # Pinned: `ubuntu-latest` rolled to 26.04, where `playwright install --with-deps` hangs
    # on apt (azure.archive.ubuntu.com unreachable) and the job times out. Unpin once fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the bun version used locally (see README).
          bun-version: 1.3.10

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The `client` and `storybook` vitest projects run in a real browser via
      # @vitest/browser-playwright, so chromium has to be present.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # `--with-deps` runs apt, which has failed on runner DNS outages
      # ("Temporary failure resolving archive.ubuntu.com"). GitHub's Ubuntu
      # images already ship Chrome's system libraries, so fall back to a
      # browser-only install rather than failing the whole job.
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium || bunx playwright install chromium

      - name: Type-check
        run: bun run check

      - name: Lint (prettier + eslint)
        run: bun run lint

      # Unit/component lane only — no Postgres service; the schema-shape tests
      # run without a database by design (see docs/DATABASE.md). The DB
      # integration lane is the separate `db integration` job below.
      - name: Test
        run: bun run test
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      # Catches build-only failures that check/lint/test miss (e.g. UST-76: an empty
      # BETTER_AUTH_SECRET broke `vite build` while every other gate was green).
      # `.env.example` carries dev-only placeholders, which is all a build needs.
      - name: Build
        run: cp .env.example .env && bun run build

  db-integration:
    name: db integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      # The lane creates this database itself and applies drizzle/ migrations to it.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ustay_test
      BETTER_AUTH_SECRET: ci-only-insecure-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: DB integration tests
        run: bun run test:db
